name: Prepare WordPress update

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (prepare a draft before publishing immutable releases)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: lieve-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  package:
    if: github.event_name == 'workflow_dispatch' || (github.event.release.draft == false && github.event.release.prerelease == false)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      LIEVE_RELEASE_ACCEPTED: ${{ vars.LIEVE_RELEASE_ACCEPTED }}
      LIEVE_PACKAGE_DIR: ${{ github.workspace }}/.lieve-release
    steps:
      - name: Validate stable tag
        run: node -e 'if (!/^v?(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/.test(process.env.RELEASE_TAG)) throw Error("A stable numeric tag is required");'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Require release acceptance
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          if (process.env.LIEVE_RELEASE_ACCEPTED !== 'true') throw Error('Release acceptance is not confirmed. Complete the documented tests and browser acceptance first.');
          fs.mkdirSync(process.env.LIEVE_PACKAGE_DIR, {recursive: true});
          NODE
      - name: Validate identity, tag and package inventory
        run: node scripts/package.mjs --check --tag "$RELEASE_TAG"
      - name: Build installable ZIP and SHA-256 manifest
        run: node scripts/package.mjs --tag "$RELEASE_TAG"
      - name: Independently verify archive and sidecar before upload
        run: |
          VERSION="${RELEASE_TAG#v}"
          node scripts/package.mjs --verify "$LIEVE_PACKAGE_DIR/lieve-builder-$VERSION.zip" --tag "$RELEASE_TAG"
          unzip -t "$LIEVE_PACKAGE_DIR/lieve-builder-$VERSION.zip"
      - name: Attach assets (never overwrite published assets)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/release-assets.mjs
